<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catálogo Andradinox</title>
  <link rel="stylesheet" href="web/pdf_viewer.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #1a1a1a; }
    #viewerContainer { position: absolute; inset: 0; overflow: auto; }
    .pdfViewer .page { margin: 12px auto; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5); }
    .annotationLayer :is(.linkAnnotation, .buttonWidgetAnnotation.pushButton):not(.hasBorder) > a:hover,
    .annotationLayer .linkAnnotation.hasBorder:hover {
      background-color: transparent !important;
      opacity: 1 !important;
    }
    /* Native-PDF fallback, used when pdf.js cannot run in this browser. */
    #nativeFallback {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    body.fallback-active #nativeFallback { display: block; }
    body.fallback-active #viewerContainer,
    body.fallback-active #zoomControls { display: none; }
    #zoomControls {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 16px;
      display: flex;
      align-items: center;
      gap: 1px;
      background: #262626;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      z-index: 10;
      font-family: system-ui, sans-serif;
    }
    #zoomControls button {
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    #zoomControls button:hover { background: #3a3a3a; }
    #zoomControls button:disabled { color: #666; cursor: default; background: transparent; }
    #zoomLevel {
      min-width: 46px;
      text-align: center;
      color: #ccc;
      font-size: 12px;
      -webkit-user-select: none;
      user-select: none;
    }
    /* Small screens pinch-to-zoom natively, so the control only takes up space. */
    @media (max-width: 640px) {
      #zoomControls { display: none; }
    }
  </style>
  <script src="build/pdf.mjs" type="module"></script>
  <script src="web/pdf_viewer.mjs" type="module"></script>
</head>
<body tabindex="1">
  <div id="viewerContainer">
    <div id="viewer" class="pdfViewer"></div>
  </div>
  <div id="zoomControls">
    <button id="zoomOut" type="button" aria-label="Diminuir zoom">−</button>
    <span id="zoomLevel">100%</span>
    <button id="zoomIn" type="button" aria-label="Aumentar zoom">+</button>
  </div>
  <iframe id="nativeFallback" title="Catálogo Andradinox"></iframe>

  <!-- Classic script: runs even if the module scripts below fail to load or parse,
       which is the only way to recover from a browser that cannot run pdf.js. -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var fileParam = params.get('file') || '../../output/previews/Andradinox-Prototype-v0.1.pdf';
      window.__pdfFileUrl = new URL(fileParam, window.location.href).href;
      window.__pdfReady = false;
      window.__lastError = null;

      window.__activateFallback = function (reason) {
        if (document.body.classList.contains('fallback-active')) return;
        console.warn('pdf.js unavailable, using native PDF viewer. Reason:', reason);
        var frame = document.getElementById('nativeFallback');
        frame.src = window.__pdfFileUrl;
        document.body.classList.add('fallback-active');
      };

      window.addEventListener('error', function (e) {
        window.__lastError = (e && (e.message || e.type)) || 'error';
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        window.__lastError = (e && e.reason && (e.reason.message || String(e.reason))) || 'rejection';
      });

      // If pdf.js never defined its globals, the library itself failed to run.
      window.addEventListener('load', function () {
        if (typeof window.pdfjsLib === 'undefined' || typeof window.pdfjsViewer === 'undefined') {
          window.__activateFallback('pdf.js globals missing (' + (window.__lastError || 'no error reported') + ')');
        }
      });

      // Backstop: pdf.js loaded but never finished rendering a page.
      setTimeout(function () {
        if (!window.__pdfReady) {
          window.__activateFallback('timeout (' + (window.__lastError || 'no error reported') + ')');
        }
      }, 20000);
    })();
  </script>

  <script type="module">
    const fileUrl = window.__pdfFileUrl;

    pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('build/pdf.worker.mjs', window.location.href).href;

    const eventBus = new pdfjsViewer.EventBus();
    const linkService = new pdfjsViewer.PDFLinkService({
      eventBus,
      externalLinkTarget: pdfjsViewer.LinkTarget.BLANK,
      externalLinkRel: 'noopener noreferrer',
    });

    const pdfViewer = new pdfjsViewer.PDFViewer({
      container: document.getElementById('viewerContainer'),
      eventBus,
      linkService,
    });
    linkService.setViewer(pdfViewer);

    const isSmallScreen = window.matchMedia('(max-width: 640px)').matches;

    eventBus.on('pagesinit', () => {
      pdfViewer.currentScaleValue = isSmallScreen ? '1.2' : '1.4';
    });

    // A rendered page is the only proof pdf.js actually works in this browser.
    eventBus.on('pagerendered', () => {
      window.__pdfReady = true;
    });

    const zoomLevelEl = document.getElementById('zoomLevel');
    const zoomInBtn = document.getElementById('zoomIn');
    const zoomOutBtn = document.getElementById('zoomOut');

    eventBus.on('scalechanging', (evt) => {
      zoomLevelEl.textContent = Math.round(evt.scale * 100) + '%';
    });
    zoomInBtn.addEventListener('click', () => pdfViewer.increaseScale());
    zoomOutBtn.addEventListener('click', () => pdfViewer.decreaseScale());

    try {
      const pdfDocument = await pdfjsLib.getDocument({ url: fileUrl }).promise;
      pdfViewer.setDocument(pdfDocument);
      linkService.setDocument(pdfDocument, null);
    } catch (err) {
      window.__activateFallback('getDocument failed: ' + (err && err.message ? err.message : err));
    }
  </script>
</body>
</html>
